[project]
name = "comp-arch-hw2"
version = "1.0.0"
description = "Python-based tooling to bulk-compile and execute an instructor's Cache Simulator written in C"
readme = "README.md"
authors = [{ name = "Agareverie", email = "agareverie@noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pandas-stubs>=3.1.0.261029",
    "typer>=0.27.3",
]

[project.scripts]
comp-arch-hw2 = "comp_arch_hw2.everything:app"
everything = "comp_arch_hw2.everything:app"
codegen = "comp_arch_hw2.codegen:app"
execute-all = "comp_arch_hw2.execute_all:app"
plot = "comp_arch_hw2.plot:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
